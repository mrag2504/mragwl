      cancel(h.hideId);                 // this mole's hide timer — we're lowering it ourselves
      h.up = false;
      h.el.classList.remove("up");
      h.el.classList.add("hit");
      const pop = document.createElement("span");
      pop.className = "whack-pop";
      pop.textContent = "+" + gain;
      if (h.golden) pop.style.color = "var(--warn)";
      h.el.appendChild(pop);
      later(() => { pop.remove(); h.el.classList.remove("hit", "golden"); h.golden = false; }, 550);
      SFX[h.golden ? "power" : "good"]();
      sync();
      scheduleSpawn(Math.max(250, 550 - score * 6));
    }
    function end() {
      if (over) return;
      over = true;
      clearAll();
      holes.forEach(h => h.el.classList.remove("up"));
      SFX.die();
      const isBest = score > bestAtStart;
      if (isBest) { store.set("whack", score); toast("🏆 New record!"); }
      sync();
      overlay("⏰ Time's up!", [`You whacked <b>${score}</b>`, isBest ? "New record!" : `Best: ${store.get("whack", 0)}`], [
        { label: "Play again", primary: true, fn: reset },
        { label: "← Arcade", fn: () => goLobby() },
      ]);
    }

    reset();
    tip("30 seconds! Bop moles the moment they pop — golden 🌟 moles are worth 3 points");
    return () => { clearAll(); };
  }

  // ============================== launcher / router ==============================
  const GAMES = [
    { id: "snake",    name: "Neon Snake",      icon: "🐍", glow: "rgba(0,212,255,.28)",  desc: "Glowing serpent, wrapping portals, speed that keeps climbing.",        bestKey: "snake",    bestFmt: v => `Best: ${fmt(v)}`, start: snakeGame },
    { id: "2048",     name: "2048",            icon: "🔢", glow: "rgba(255,180,84,.25)", desc: "Slide and merge tiles up to the golden 2048 tile. Undo included.",    bestKey: "2048",     bestFmt: v => `Best: ${fmt(v)}`, start: g2048 },
    { id: "breakout", name: "Neon Breakout",   icon: "🧱", glow: "rgba(255,92,122,.25)", desc: "Smash bricks, catch power-ups — multi-ball, wide paddle, slow-mo.",    bestKey: "breakout", bestFmt: v => `Best: ${fmt(v)}`, start: breakoutGame },
    { id: "typing",   name: "Typing Defender", icon: "⌨️", glow: "rgba(124,92,255,.30)", desc: "Words fall from the sky. Type them before they cross the red line.",  bestKey: "typing",   bestFmt: v => `Best: ${fmt(v)}`, start: typingGame },
    { id: "pong",     name: "Neon Pong",       icon: "🏓", glow: "rgba(61,220,132,.25)", desc: "Classic paddle duel vs a relentless CPU. First to 7 wins.",           bestKey: "pong-wins", bestFmt: v => `Wins: ${v}`,     start: pongGame },
    { id: "memory",   name: "Memory Match",    icon: "🃏", glow: "rgba(0,212,255,.25)",  desc: "Flip cards, find pairs, chase the fewest-moves record.",               bestKey: "memory",   bestFmt: v => `${v} moves`,     start: memoryGame },
    { id: "mines",    name: "Minesweeper",     icon: "💣", glow: "rgba(255,92,122,.25)", desc: "Clear the field without hitting a mine — first click is always safe.", bestKey: "mines",    bestFmt: v => `${v}s`,         start: minesweeperGame },
    { id: "flappy",   name: "Neon Flap",       icon: "🐦", glow: "rgba(255,180,84,.30)", desc: "One button, infinite pipes — how far can you fly?",                    bestKey: "flappy",   bestFmt: v => `Best: ${v}`,     start: flappyGame },
    { id: "tetris",   name: "Neon Blocks",     icon: "🧩", glow: "rgba(124,92,255,.30)", desc: "Rotate and stack the seven blocks — clear lines and level up.",        bestKey: "tetris",   bestFmt: v => `Best: ${fmt(v)}`, start: tetrisGame },
    { id: "simon",    name: "Simon Says",      icon: "🎵", glow: "rgba(61,220,132,.25)", desc: "Watch the light-and-sound pattern and repeat it — rounds speed up.",   bestKey: "simon",    bestFmt: v => `${v} rounds`,    start: simonGame },
    { id: "whack",    name: "Whack-a-Mole",    icon: "🔨", glow: "rgba(0,212,255,.25)",  desc: "30 seconds of mole-bopping — golden 🌟 moles score triple.",           bestKey: "whack",    bestFmt: v => `Best: ${v}`,     start: whackGame },
  ];

  let current = null;
  function renderLauncher() {
    launcher.innerHTML = "";
    let records = 0;
    for (const g of GAMES) {
      const best = store.get(g.bestKey, 0);
      if (best) records++;
      const card = document.createElement("div");
      card.className = "g-card";
      card.style.setProperty("--glow", g.glow);
      card.innerHTML = `
        <div class="g-icon">${g.icon}</div>
        <div class="g-name">${g.name}</div>
        <div class="g-desc">${g.desc}</div>
        <span class="g-best ${best ? "" : "none"}">${best ? g.bestFmt(best) : "No record yet"}</span>`;
      card.addEventListener("click", () => { SFX.unlock(); SFX.click(); openGame(g); });
      launcher.appendChild(card);
    }
    $("records-chip").textContent = `🏆 ${records}/${GAMES.length}`;
    $("sub-line").textContent = `${GAMES.length} games · records saved in your browser`;
  }
  function openGame(g) {
    if (current) { current(); current = null; }
    stage.innerHTML = ""; hudEl.innerHTML = "";
    launcher.classList.add("hidden");
    stage.classList.remove("hidden");
    hudEl.classList.remove("hidden");
    $("back-btn").classList.remove("hidden");
    current = g.start();
    window.scrollTo({ top: 0 });
  }
  function goLobby() {
    if (current) { current(); current = null; }
    stage.innerHTML = ""; hudEl.innerHTML = "";
    stage.classList.add("hidden"); hudEl.classList.add("hidden");
    $("back-btn").classList.add("hidden");
    launcher.classList.remove("hidden");
    renderLauncher();
  }
  $("back-btn").addEventListener("click", () => { SFX.click(); goLobby(); });

  const muteBtn = $("mute-btn");
  function syncMute() { muteBtn.textContent = SFX.muted ? "🔇" : "🔊"; }
  muteBtn.addEventListener("click", () => { store.set("muted", !SFX.muted); syncMute(); if (!SFX.muted) SFX.click(); });
  syncMute();

  $("reset-records").addEventListener("click", () => {
    if (!confirm("Reset every high score and record?")) return;
    store.data = {};
    localStorage.setItem("neon-arcade", JSON.stringify(store.data));
    renderLauncher(); toast("Records wiped");
  });

  renderLauncher();
})();
</script>
</body>
</html>
